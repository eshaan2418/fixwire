name: CI
on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cxx: clang++, name: linux-clang }
          - { os: ubuntu-latest, cxx: g++, name: linux-gcc }
          - { os: macos-latest, cxx: clang++, name: macos-arm64 }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - run: cmake --build build -j 4
      - run: ctest --test-dir build -j 2 --output-on-failure
      - name: Loopback smoke (exchange + client)
        run: |
          build/fixwire-exchange --port 19878 --once & sleep 1
          build/fixwire-client --port 19878 --orders 5000 --window 8

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++ -DFIXWIRE_SANITIZE=address,undefined
      - run: cmake --build build -j 4
      - run: ctest --test-dir build -j 2 --output-on-failure
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  quickfix-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 4
      - run: pip install quickfix
      - run: python interop/qf_interop.py build interop.json

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: |
          cmake -S . -B build-fuzz -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFIXWIRE_FUZZ=ON
          cmake --build build-fuzz --target fuzz-parser -j 4
      - run: mkdir -p corpus && build-fuzz/fuzz-parser corpus -max_total_time=120 -rss_limit_mb=2048
